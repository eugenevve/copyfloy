name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version and check release does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Bump the version in package.json first."
            exit 1
          fi

      - name: Generate release notes
        shell: bash
        run: |
          # The previous release commit (X.Y.Z), excluding the current version
          PREV=$(git log -E --grep='^[0-9]+\.[0-9]+\.[0-9]+$' --format='%H %s' \
            | awk -v v="$VERSION" 'NF==2 && $2 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ && $2 != v {print $1; exit}')
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi

          re='\(#[0-9]+\)$'
          {
            echo "## ✨ What's new"
            echo
            git log "$RANGE" --no-merges -E --grep='^[0-9]+\.[0-9]+\.[0-9]+$' --invert-grep \
              --pretty=format:'%H%x09%s' | while IFS=$'\t' read -r sha subject; do
              if [[ $subject =~ $re ]]; then
                echo "- $subject"
              else
                echo "- $subject ($sha)"
              fi
            done
            echo
            echo
            echo "---"
            echo
            sed "s/__VERSION__/$VERSION/g" .github/release-footer.md
          } > notes.md

          cat notes.md

      - run: npm ci

      - name: Build
        run: npm run build:win -- --publish never

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            "dist/Copyfloy-setup-$VERSION.exe" \
            "dist/Copyfloy-setup-$VERSION.exe.blockmap" \
            dist/latest.yml \
            --title "Copyfloy $VERSION" \
            --notes-file notes.md \
            --target "$(git rev-parse HEAD)"
